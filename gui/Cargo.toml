[package]
name = "cleaner"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cleaner"
path = "src/main.rs"

[dependencies]
thiserror = "2"
rayon = "1"
dirs = "5"
gpui = { package = "gpui-pre", version = "=0.3.4" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.4", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "bb2fcf35040e433a717e2924cf99a0e45988bfbd" }

[dev-dependencies]
tempfile = "3"
