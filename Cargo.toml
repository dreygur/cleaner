[workspace]
members = [".", "ui"]

[package]
name = "cleaner"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Disk reclaimer for macOS development machines"

[lib]
name = "cleaner"
path = "src/lib.rs"

[[bin]]
name = "cleaner"
path = "src/main.rs"

[dependencies]
anstream = "0.6"
anstyle = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
libc = "0.2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

# Matches the Go build's -s -w: stripped, optimized for the comparison.
[profile.release]
lto = true
codegen-units = 1
strip = true
