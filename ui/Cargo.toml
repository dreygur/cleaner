[package]
name = "cleaner-ui"
version = "0.2.2"
edition = "2024"
license = "MIT"
description = "Window UI for cleaner"

[[bin]]
name = "cleaner-ui"
path = "src/main.rs"

[dependencies]
cleaner = { path = ".." }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = "1"
serde_json = "1"
slint = { version = "1.18", features = ["unstable-winit-030", "raw-window-handle-06"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSToolbar"] }

[build-dependencies]
slint-build = "1.18"
